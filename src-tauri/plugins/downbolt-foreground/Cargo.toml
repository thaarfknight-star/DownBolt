[package]
name = "tauri-plugin-downbolt-foreground"
version = "0.1.0"
links = "tauri-plugin-downbolt-foreground"
edition = "2021"
description = "پلاگین سرویس foreground اندروید DownBolt: نوتیفیکیشن دائمی دانلودها با اکشن‌های شروع همه / توقف همه / خروج"
authors = ["Taha Arefi"]

[lib]
name = "tauri_plugin_downbolt_foreground"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2" }

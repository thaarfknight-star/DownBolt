[package]
name = "tauri-plugin-downbolt-install"
version = "0.1.0"
links = "tauri-plugin-downbolt-install"
edition = "2021"
description = "پلاگین نصب APK دانلودشده برای موتور آپدیت DownBolt (فقط اندروید)"
authors = ["Taha Arefi"]

[lib]
name = "tauri_plugin_downbolt_install"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2" }

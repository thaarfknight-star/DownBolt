[package]
name = "download-manager"
version = "0.6.5"
description = "DownBolt — دانلودمنیجر دسکتاپ (Rust + Tauri)"
edition = "2021"

[lib]
name = "download_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-downbolt-install = { path = "plugins/downbolt-install" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
zip = "2"
sha2 = "0.10"
[profile.release]
strip = true

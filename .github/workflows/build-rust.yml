name: Build (Rust + Tauri)

# دانلودمنیجر — پایپ‌لاین بیلد ویندوز + اندروید روی یک ریپو و یک ریلیز (الگو: LagSlice-RS)
# TODO بعد از نهایی‌شدن اسم محصول: tagName و releaseName را با نام محصول شخصی‌سازی کن.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # اجباری (درس LagSlice): نصب وابستگی‌های فرانت/CLI حتماً قبل از tauri-action
      - name: Install frontend dependencies
        run: npm install

      # هلپر آپدیت (موتور v2): باید قبل از بیلد اصلی آماده باشد (externalBin)
      - name: Build update helper
        shell: pwsh
        run: |
          cargo build --release --manifest-path updater/Cargo.toml
          Copy-Item "updater/target/release/DownBoltUpdater.exe" "src-tauri/binaries/DownBoltUpdater-x86_64-pc-windows-msvc.exe" -Force

      - name: Build and publish draft release (NSIS Setup)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: v__VERSION__
          releaseName: "DownBolt v__VERSION__"
          releaseBody: "فایل Setup ویندوز (NSIS) و APK اندروید در فایل‌های زیر هستند."
          releaseDraft: true
          prerelease: false

      - name: Upload app binaries (for the update feed)
        uses: actions/upload-artifact@v4
        with:
          name: app-binaries
          path: |
            src-tauri/target/release/download-manager.exe
            src-tauri/binaries/DownBoltUpdater-x86_64-pc-windows-msvc.exe
          if-no-files-found: error

  # اندروید روی همان ریپو؛ APK به همان ریلیزی می‌رود که جاب ویندوز ساخته است.
  # امضا: فعلاً بیلد debug (امضای خودکار با دیباگ‌کی) — برای انتشار نهایی باید
  # کی‌استور واقعی تعریف و بیلد release امضاشده جایگزین شود.
  build-android:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          SDKMANAGER=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "ndk;27.0.12077973"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Setup Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Init Android project
        run: npx tauri android init

      # آیکن‌های لانچر DownBolt از ست رسمی تولیدشده (src-tauri/icons/android)
      # روی قالب پیش‌فرض Tauri می‌نشینند — وگرنه آیکن پیش‌فرض قالب می‌ماند.
      - name: Apply Android launcher icons
        run: cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      - name: Setup release signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/signing"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/signing/downbolt-release.p12"
          cat > src-tauri/gen/android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/signing/downbolt-release.p12
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build Android APK (release, split per ABI)
        run: npx tauri android build --apk --split-per-abi

      # امضای قطعی با ابزار رسمی اندروید (مستقل از قالب گریدل): zipalign + apksigner + verify
      - name: Sign APKs with apksigner
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          echo "build-tools: $BT"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/downbolt.p12"
          FOUND=0
          for apk in $(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk"); do
            abi=$(basename "$(dirname "$(dirname "$apk")")")
            aligned="$RUNNER_TEMP/aligned-$abi.apk"
            signed="DownBolt-v${VERSION}-android-${abi}.apk"
            "$ANDROID_SDK_ROOT/build-tools/$BT/zipalign" -p 4 "$apk" "$aligned"
            "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/downbolt.p12" --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --out "$signed" "$aligned"
            "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" verify "$signed"
            echo "signed: $signed"
            FOUND=1
          done
          if [ "$FOUND" = "0" ]; then echo "::error::هیچ APKای برای امضا پیدا نشد"; exit 1; fi

      - name: Upload APKs to the same release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          for apk in DownBolt-v${VERSION}-android-*.apk; do
            gh release upload "v${VERSION}" "$apk" --clobber
          done

  # موتور آپدیت v2 (مثل شیرین‌حساب): بسته‌های آپدیت ویندوز + فید ثابت
  # (با بخش android از روی APKهای امضاشده‌ی همان ریلیز) + انتشار ریلیز.
  release-update:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download app binaries
        uses: actions/download-artifact@v4
        with:
          name: app-binaries
          path: bin

      - name: Build update packages and publish feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "version=$VERSION"

          # استیج بسته‌ی آپدیت: exe + هلپر + version.txt + CHANGELOG
          mkdir -p stage dist-feed android-apks prev
          cp bin/target/release/download-manager.exe stage/
          cp bin/binaries/DownBoltUpdater-x86_64-pc-windows-msvc.exe stage/DownBoltUpdater.exe
          cp version.txt CHANGELOG_FA.md stage/

          # APKهای امضاشده‌ی همین نسخه از درفت‌ریلیز (برای بخش android فید)
          gh release download "v${VERSION}" --pattern "DownBolt-v${VERSION}-android-*.apk" --dir android-apks

          # مانیفست قبلی از فید غلتان (برای دلتا) — نبودنش خطا نیست
          PREV_ARGS=""
          FEED_TMP=$(mktemp -d)
          if gh release download update-feed --pattern "update-feed.json" --dir "$FEED_TMP" 2>/dev/null; then
            PREV_VER=$(python3 -c "import json; print(json.load(open('$FEED_TMP/update-feed.json'))['version'])" 2>/dev/null || echo "")
            if [ -n "$PREV_VER" ] && [ "$PREV_VER" != "$VERSION" ]; then
              if gh release download "v${PREV_VER}" --pattern "DownBolt-Update-*.zip" --dir prev 2>/dev/null && ls prev/*.zip >/dev/null 2>&1; then
                python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extract('update_info.json', 'prev')" prev/DownBolt-Update-v${PREV_VER}.zip || true
                if [ -f prev/update_info.json ]; then
                  mv prev/update_info.json prev/manifest.json
                  PREV_ARGS="--prev-manifest prev/manifest.json"
                fi
              fi
            fi
          fi

          python3 tools/make_feed.py --build-dir stage --version "$VERSION" \
            --changelog CHANGELOG_FA.md --android-dir android-apks \
            --out-dir dist-feed $PREV_ARGS

          # آپلود بسته‌های آپدیت روی ریلیز نسخه و انتشار ریلیز
          gh release upload "v${VERSION}" dist-feed/*.zip --clobber
          # نکته: گرفتن ریلیز با تگ برای درفت‌ها 404 می‌دهد؛ از لیست پیدا می‌کنیم.
          REL_ID=$(gh api "repos/${{ github.repository }}/releases?per_page=20" | python3 -c "import json,sys; print([r['id'] for r in json.load(sys.stdin) if r['tag_name'] == 'v$VERSION'][0])")
          curl -s -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${REL_ID}" \
            -d '{"draft": false}' > /dev/null

          # فید روی ریلیز غلتان update-feed
          if ! gh release view update-feed > /dev/null 2>&1; then
            gh release create update-feed --title "Update Feed" \
              --notes "فید ثابت موتور آپدیت (دست نزنید)."
          fi
          gh release upload update-feed dist-feed/update-feed.json dist-feed/manifest.json --clobber
          echo "feed published for $VERSION"
